name: Release

on:
  push:
    tags:
      - "cache-view-v*"
      - "chat-tree-v*"
      - "prompt-enhancer-v*"
      - "session-recap-v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve package
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          case "${tag}" in
            cache-view-v*)
              package_dir="packages/cache-view"
              package_name="@mtayfur/opencode-cache-view"
              version="${tag#cache-view-v}"
              ;;
            chat-tree-v*)
              package_dir="packages/chat-tree"
              package_name="@mtayfur/opencode-chat-tree"
              version="${tag#chat-tree-v}"
              ;;
            prompt-enhancer-v*)
              package_dir="packages/prompt-enhancer"
              package_name="@mtayfur/opencode-prompt-enhancer"
              version="${tag#prompt-enhancer-v}"
              ;;
            session-recap-v*)
              package_dir="packages/session-recap"
              package_name="@mtayfur/opencode-session-recap"
              version="${tag#session-recap-v}"
              ;;
            *)
              echo "Unsupported release tag: ${tag}" >&2
              exit 1
              ;;
          esac

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version in tag: ${version}" >&2
            exit 1
          fi

          echo "PACKAGE_DIR=${package_dir}" >> "${GITHUB_ENV}"
          echo "PACKAGE_NAME=${package_name}" >> "${GITHUB_ENV}"
          echo "PACKAGE_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        if: env.PACKAGE_NAME == '@mtayfur/opencode-chat-tree'
        run: bun run --filter "${PACKAGE_NAME}" fmt:check

      - name: Typecheck
        run: bun run --filter "${PACKAGE_NAME}" typecheck

      - name: Build
        run: bun run --filter "${PACKAGE_NAME}" build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          registry-url: "https://registry.npmjs.org"

      - name: Sync package version from tag
        run: npm version "${PACKAGE_VERSION}" --no-git-tag-version --allow-same-version
        working-directory: ${{ env.PACKAGE_DIR }}

      - name: Publish to npm
        run: npm publish --access public
        working-directory: ${{ env.PACKAGE_DIR }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
