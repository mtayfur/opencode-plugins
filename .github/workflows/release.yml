name: Release

on:
  push:
    tags:
      - "cache-view-v*"
      - "chat-tree-v*"
      - "codex-fast-v*"
      - "prompt-enhancer-v*"
      - "session-recap-v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve package
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          case "${tag}" in
            cache-view-v*)
              package_dir="packages/cache-view"
              package_name="@mtayfur/opencode-cache-view"
              version="${tag#cache-view-v}"
              ;;
            chat-tree-v*)
              package_dir="packages/chat-tree"
              package_name="@mtayfur/opencode-chat-tree"
              version="${tag#chat-tree-v}"
              ;;
            codex-fast-v*)
              package_dir="packages/codex-fast"
              package_name="@mtayfur/opencode-codex-fast"
              version="${tag#codex-fast-v}"
              ;;
            prompt-enhancer-v*)
              package_dir="packages/prompt-enhancer"
              package_name="@mtayfur/opencode-prompt-enhancer"
              version="${tag#prompt-enhancer-v}"
              ;;
            session-recap-v*)
              package_dir="packages/session-recap"
              package_name="@mtayfur/opencode-session-recap"
              version="${tag#session-recap-v}"
              ;;
            *)
              echo "Unsupported release tag: ${tag}" >&2
              exit 1
              ;;
          esac

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version in tag: ${version}" >&2
            exit 1
          fi

          {
            echo "PACKAGE_DIR=${package_dir}"
            echo "PACKAGE_NAME=${package_name}"
            echo "PACKAGE_VERSION=${version}"
          } >> "${GITHUB_ENV}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          registry-url: "https://registry.npmjs.org"

      - name: Verify package version
        shell: bash
        run: |
          manifest_version="$(node -p "require('./${PACKAGE_DIR}/package.json').version")"
          if [ "${manifest_version}" != "${PACKAGE_VERSION}" ]; then
            echo "Tag version ${PACKAGE_VERSION} does not match ${PACKAGE_DIR}/package.json version ${manifest_version}." >&2
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        if: env.PACKAGE_NAME == '@mtayfur/opencode-chat-tree'
        run: bun run --filter "${PACKAGE_NAME}" fmt:check

      - name: Typecheck
        run: bun run --filter "${PACKAGE_NAME}" typecheck

      - name: Build
        run: bun run --filter "${PACKAGE_NAME}" build

      - name: Publish to npm
        run: npm publish --access public
        working-directory: ${{ env.PACKAGE_DIR }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7

      - name: Create GitHub Release
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "GitHub Release already exists for ${GITHUB_REF_NAME}."
            exit 0
          fi

          tag_ref="refs/tags/${GITHUB_REF_NAME}"
          if [ "$(git cat-file -t "${tag_ref}")" != "tag" ]; then
            echo "${GITHUB_REF_NAME} is not an annotated tag; refusing to create release notes." >&2
            exit 1
          fi

          notes="$(git for-each-ref --format='%(contents:body)' "${tag_ref}")"
          if [ -z "${notes}" ]; then
            echo "${GITHUB_REF_NAME} has no release notes." >&2
            exit 1
          fi

          notes_file="${RUNNER_TEMP}/release-notes.md"
          printf '%s\n' "${notes}" > "${notes_file}"
          gh release create "${GITHUB_REF_NAME}" --verify-tag --title "${GITHUB_REF_NAME}" --notes-file "${notes_file}"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
